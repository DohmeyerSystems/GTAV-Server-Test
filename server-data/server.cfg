## =====================================================================
##  Qbox Basis-Server – server.cfg
##  Geheimnisse (License Key, DB-Passwort, Admin-IDs) stehen NICHT hier,
##  sondern in secrets.cfg (gitignored). Vorlage: secrets.cfg.example
## =====================================================================

## Servername, Beschreibung, Tags, Banner etc. werden im Cfx Portal gepflegt:
## https://portal.cfx.re/servers

# --- Netzwerk ----------------------------------------------------------
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# --- Basis -------------------------------------------------------------
sv_maxclients 48
sv_enforceGameBuild 3258
set onesync on
set steam_webApiKey "none"

# --- Geheimnisse (sv_licenseKey, mysql_connection_string, Admins) -------
exec secrets.cfg

# --- Chat --------------------------------------------------------------
set resources_useSystemChat true
set qbx_chat:joinMessage "^2%s hat den Server betreten"
set qbx_chat:quitMessage "^1%s hat den Server verlassen (%s)"

# --- Qbox --------------------------------------------------------------
setr qb_locale "de"
setr qbx:enableBridge "true"            # qb-core-Bridge für QBCore-Scripts
set qbx:enableQueue "true"              # eingebaute Warteschlange
set qbx:bucketLockdownMode "inactive"
set qbx:discordLink "discord.gg/DEIN-LINK"
set qbx:max_jobs_per_player 1
set qbx:max_gangs_per_player 1
set qbx:setjob_replaces "true"
set qbx:setgang_replaces "true"
set qbx:cleanPlayerGroups "true"
set qbx:allowMethodOverrides "true"
set qbx:disableOverrideWarning "false"
setr qbx:enableVehiclePersistence "false"
setr qbx:vehiclePersistenceType "semi"
set qbx:acknowledge "true"              # Qbox-Service-Message ausblenden
setr qbx:enableGroupManagement "false"
setr qbx:motd "<p style='padding: 1rem; background-color: #141517; border: 1px solid #373a40; border-radius: 0.5rem; text-align: center;'><span style='color: rgb(200, 200, 40);'>Willkommen!</span></p>"

# --- illenium-appearance ------------------------------------------------
setr illenium-appearance:locale "de"

# --- ox (lib / target / inventory) -------------------------------------
exec ox.cfg

# --- Resources (Reihenfolge ist wichtig!) ------------------------------
ensure mapmanager
ensure chat
ensure spawnmanager
ensure baseevents
ensure playernames

ensure oxmysql
ensure cfxlua-require   # stellt "require" bereit – Pflicht-Abhängigkeit von ox_lib
ensure ox_lib
ensure qbx_core
ensure ox_target
ensure ox_inventory

ensure [standalone]
ensure [qbx]

# Eigene Resources (custom Scripts) – Ordner: resources/[local]
# Einkommentieren, sobald dort die erste eigene Resource liegt:
# ensure [local]

# --- Berechtigungen ----------------------------------------------------
exec permissions.cfg

# --- Sonstiges ---------------------------------------------------------
exec misc.cfg
