# =====================================================================
# resources.lock – feste Versionen aller Fremd-Resources
# =====================================================================
# Format (Whitespace-getrennt, eine Resource pro Zeile):
#   <typ>     <name>                 <github-repo>                         <ref>                                      <zielordner>      [subpath]
#
# typ = release -> lädt  https://github.com/<repo>/releases/download/<ref>/<name>.zip
#                  (nötig für ox_* / qbx_*, weil die Releases die gebaute Web-UI enthalten)
# typ = git     -> lädt  den Quellstand am Commit <ref> (optional nur <subpath>)
#
# Update-Workflow:  ref hier anpassen  ->  ./scripts/vendor-resources.sh <name>  ->  testen  ->  committen
# =====================================================================

